name: Build and Release

on:
  push:
    tags:
      - "creation-remote-android-v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Classify release
        id: classify
        run: |
          tag="${GITHUB_REF_NAME}"

          if [[ "$tag" =~ ^creation-remote-android-v([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9A-Za-z.-]+))?$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            channel="${BASH_REMATCH[5]}"
          else
            echo "Tag '$tag' must start with creation-remote-android-v" >&2
            exit 1
          fi

          version="${major}.${minor}.${patch}"
          # versionCode: a monotonically increasing integer Android requires
          # for update ordering -- encode major/minor/patch into it so it
          # only ever increases with the version string (Play Store-style
          # convention, even though this ships outside the Play Store).
          version_code=$((major * 1000000 + minor * 1000 + patch))

          prerelease="false"
          suffix=""
          if [[ -n "$channel" ]]; then
            prerelease="true"
            suffix=" ($channel)"
          elif [[ "$major" -eq 0 && "$minor" -lt 5 ]]; then
            prerelease="true"
            suffix=" (alpha)"
          elif [[ "$major" -eq 0 ]]; then
            prerelease="true"
            suffix=" (beta)"
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "version_code=$version_code"
            echo "prerelease=$prerelease"
            echo "suffix=$suffix"
          } >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew assembleRelease \
            -PversionName=${{ steps.classify.outputs.version }} \
            -PversionCode=${{ steps.classify.outputs.version_code }}

      - name: Stage release asset
        run: |
          mkdir -p artifacts
          apk=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          if [ -z "$apk" ]; then
            echo "Could not find a built release APK" >&2
            exit 1
          fi
          cp "$apk" "artifacts/creation-remote-${{ steps.classify.outputs.version }}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Creation Remote ${{ steps.classify.outputs.version }}${{ steps.classify.outputs.suffix }}
          prerelease: ${{ steps.classify.outputs.prerelease }}
          body: |
            Sideload only -- not distributed via the Play Store. Download the APK below, enable "install from unknown sources" if prompted, and install.
          files: artifacts/*
